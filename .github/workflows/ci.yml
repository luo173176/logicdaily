name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型 / 规范 / 题库 / 单元与集成测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 代码规范（0 error 才通过；warning 允许）
        run: npx eslint . --max-warnings=20

      - name: 题库内容校验
        run: npm run content:validate

      - name: 单元测试与集成测试
        run: npm run test

      - name: 生产构建
        run: npm run build

  e2e:
    name: 移动端浏览器端到端测试
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      # playwright.config.ts 的 webServer 用 `next start` 起生产服务器，
      # 而这是独立于 check 的 job，工作目录里没有 .next 构建产物，必须先构建。
      - name: 生产构建（供 next start 使用）
        run: npm run build

      - name: 端到端测试（Pixel 7 视口）
        env:
          CI: true
        run: npm run test:e2e

      - name: 失败时保留测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
